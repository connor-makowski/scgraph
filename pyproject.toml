[tool.black]
line-length = 80
target-version = ['py312']
exclude = '/.*(migrations|__pycache__|geographs).*/'

[build-system]
requires = ["scikit-build-core", "nanobind>=3.1.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
build.verbose = false
build-dir = "build/{wheel_tag}"

[[tool.scikit-build.overrides]]
if.env.SCGRAPH_NO_BUILD = true
wheel.cmake = false

[[tool.scikit-build.overrides]]
if.failed = true
if.not.env.SCGRAPH_REQUIRE_CPP = true
wheel.cmake = false

[tool.scikit-build.sdist]
exclude = ["*"]
include = [
    "scgraph/*.py",
    "scgraph/helpers/*.py",
    "scgraph/cpp/*",
    "pyproject.toml",
    "CMakeLists.txt",
    "README.md",
    "LICENSE",
]


[project]
name = "scgraph"
version = "3.6.0b1"
description = "Determine an approximate distance and route between two points on earth."
authors = [
    {name="Connor Makowski", email="conmak@mit.edu"}
]
readme = "README.md"
requires-python = ">=3.11"
license="MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
]
dependencies = [
    "geokdtree>=1.3.0",
    "bmsspy>=2.2.1,<3.0.0",
    "requests>=2.32.0,<3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pamda>=2.10.0",
    "autoflake>=2.3.1",
    "black>=25.1.0",
    "build>=1.2.2",
    "nox>=2026.4.10",
    "nox-uv>=0.8.0",
    "pdoc>=15.0.1",
    "twine>=6.1.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["test"]
python_files = ["*_test.py"]

[tool.uv]
no-build-isolation-package = []

[project.urls]
"Homepage" = "https://github.com/connor-makowski/scgraph"
"Bug Tracker" = "https://github.com/connor-makowski/scgraph/issues"
"Documentation" = "https://connor-makowski.github.io/scgraph/scgraph.html"

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *_i686 pp*"
test-command = "pytest {project}/test"
test-requires = ["pytest>=9.0.3"]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]
repair-wheel-command = ""
