[pytest]
# The acceptance suite runs alone, on one network file:
#     pytest acceptance --network FILE.scgraph
# This file makes this folder the rootdir, so that the repository's pytest settings and
# test/conftest.py (which skips this folder: collect_ignore) do not apply. `pythonpath`
# lets the tests import the helpers of conftest.py under any import mode.
pythonpath = .
addopts = -rs
