name: Build the reference networks

# A network release publishes network files as assets of a GitHub release.
#
# To make one, push a tag `networks-YYYY.MM.DD` on a commit of `dev`. A development
# release adds `-dev.N` and is published as a pre-release. The last job creates the
# release as a draft. A maintainer reads the draft, then publishes it. The files of a
# published release never change: a correction is a new tag.
#
# One network is built from its sources: `world_multimodal`, by the pipeline
# `osm_world_multimodal`. Every other file is derived from it by
# `scgraph.pipelines.derived_networks`, with no download: `DERIVED_NETWORKS` of that module
# names the derived networks. The world file is carried over from the previous
# published network release when the same pipeline, at the same version, built it
# from the same source URLs. That release may be a development release.
on:
  push:
    tags:
      - "networks-*"

permissions:
  contents: read

# Two runs for one tag would both create its draft
concurrency:
  group: ${{ github.ref }}

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}
  # jq filter: the tag of the last published network release, or nothing
  PREVIOUS_TAG_FILTER: >-
    [.[] | select(.tagName | startswith("networks-")) | select(.isDraft | not)]
    | sort_by(.publishedAt) | last | .tagName // ""

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Stop if the tag is misspelled or its release is published
        run: |
          if ! [[ "$TAG" =~ ^networks-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-dev\.[0-9]+)?$ ]]; then
            echo "$TAG is not networks-YYYY.MM.DD or networks-YYYY.MM.DD-dev.N"; exit 1
          fi
          is_draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || true)
          if [ "$is_draft" = "false" ]; then echo "$TAG is published"; exit 1; fi

  world:
    name: world_multimodal
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 355 # a job is stopped at 6 hours
    env:
      SCGRAPH_REQUIRE_CPP: "1"
    outputs:
      previous_tag: ${{ steps.previous.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # The same planet file on another mirror. A runner reads it several times
      # faster than the mirror of the code, which keeps a world build far from the
      # 6 hours of a job. The built file records the mirror that was read.
      - name: Read the planet from the us-west-2 mirror
        run: |
          sed -i 's/osm-planet-eu-central-1\.s3\.dualstack\.eu-central-1/osm-planet-us-west-2.s3.dualstack.us-west-2/' \
            scgraph/pipelines/steps/step1_osm_sources.py
          grep -n 'osm-planet-us-west-2' scgraph/pipelines/steps/step1_osm_sources.py
      - name: Install scgraph with the C++ extension and osmium
        run: uv sync --extra osm
      - name: Find the previous network release
        id: previous
        run: |
          tag=$(gh release list --limit 100 --json tagName,isDraft,publishedAt -q "$PREVIOUS_TAG_FILTER")
          echo "previous network release: ${tag:-none}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # The URL of each source tells its content: the planet file has its date in its
      # name, and the other sources are read at a fixed commit or kept with the code.
      - name: Carry over the world file, if this pipeline built it from these sources
        if: steps.previous.outputs.tag != ''
        run: |
          mkdir previous
          gh release download "${{ steps.previous.outputs.tag }}" --dir previous \
            --pattern 'world_multimodal.scgraph*'
          if [ -f previous/world_multimodal.scgraph.gz ]; then gunzip previous/world_multimodal.scgraph.gz; fi
          uv run python - <<'PYTHON'
          import os
          from scgraph import GeoGraph
          from scgraph.pipelines import osm_world_multimodal as pipeline

          file = "previous/world_multimodal.scgraph"
          try:
              info = GeoGraph.get_scgraph_info(file)
          except ValueError as error:  # another file format: build the network
              print(error)
              raise SystemExit
          then = (
              info["pipeline"]["name"],
              info["pipeline"]["version"],
              {s["name"]: s["url"] for s in info["sources"]},
          )
          now = (
              "osm_world_multimodal",
              pipeline.PIPELINE_VERSION,
              {name: source["url"] for name, source in pipeline.SOURCES.items()},
          )
          print(f"then: {then}\nnow:  {now}")
          if then == now:
              os.makedirs("files")
              os.replace(file, "files/world_multimodal.scgraph")
          PYTHON
      - name: Build and validate the world network, if it is not carried over
        run: |
          if [ -f files/world_multimodal.scgraph ]; then echo "carried over"; exit 0; fi
          uv run python -m scgraph.pipelines.network_builder osm_world_multimodal --cache-dir cache --validate
          mkdir -p files
          cp cache/networks/osm_world_multimodal/*.scgraph files/world_multimodal.scgraph
      - uses: actions/upload-artifact@v4
        with:
          name: world
          path: files/world_multimodal.scgraph
          retention-days: 14

  release:
    name: Derive the files and create the draft release
    needs: world
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      SCGRAPH_REQUIRE_CPP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install scgraph with the C++ extension
        run: uv sync
      - uses: actions/download-artifact@v4
        with:
          name: world
          path: files
      # Each derived network gives two files: with the shapes of its edges, and
      # without them. The command also writes the world file without shapes.
      - name: Derive and validate each network
        run: |
          uv run python -m scgraph.pipelines.derived_networks files/world_multimodal.scgraph files
          ls -l files
      # A run that is started again replaces its own draft
      - name: Delete the draft of an earlier run
        run: |
          is_draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || true)
          if [ "$is_draft" = "true" ]; then gh release delete "$TAG" --yes; fi
      - name: Download the index of the previous network release
        run: |
          mkdir previous
          if [ -n "${{ needs.world.outputs.previous_tag }}" ]; then
            gh release download "${{ needs.world.outputs.previous_tag }}" --dir previous --pattern networks.json
          fi
      - name: Assemble the release
        run: |
          uv run python utils/draft_network_release.py files previous release "$TAG" "$GITHUB_SHA"
          cat release/notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create the draft
        run: |
          case "$TAG" in *-dev.*) kind=--prerelease ;; *) kind= ;; esac
          gh release create "$TAG" --verify-tag --draft --latest=false $kind \
            --title "$TAG" --notes-file release/notes.md \
            release/*.scgraph.gz release/networks.json
